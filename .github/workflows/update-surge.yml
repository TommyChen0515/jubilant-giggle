name: Auto Update HaGeZi Ultimate for Surge

# Trigger rules
on:
  schedule:
    - cron: '0 20 * * *'   # Every day at 20:00 UTC (GitHub always uses UTC)
  workflow_dispatch:        # Adds a "Run workflow" button for manual runs

jobs:
  update-rules:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # Lets the bot commit to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download and Convert Rules
        run: |
          set -euo pipefail   # Stop immediately if any command fails

          URL="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/ultimate-onlydomains.txt"

          echo "Downloading HaGeZi Ultimate wildcard domains..."
          curl -fsSL --retry 3 --retry-delay 5 "$URL" -o raw_ultimate.txt

          echo "Converting to Surge DOMAIN-SET format..."
          awk '!/^#/ && NF {
            d = $1
            sub(/\r$/, "", d)        # strip Windows line endings
            sub(/^\*?\./, "", d)     # strip any leading "*." or "."
            if (d != "") print "." d # ".example.com" = domain + all subdomains
          }' raw_ultimate.txt | sort -u > body.tmp

          # Count rules
          COUNT=$(grep -c '^\.' body.tmp || true)
          echo "Total domains: $COUNT"

          echo "Safety check..."
          if [ "$COUNT" -lt 100000 ]; then
            echo "❌ Too few domains ($COUNT). Download probably failed. Aborting."
            exit 1
          fi

          # Pull upstream version from HaGeZi's header (blank if not found)
          UPSTREAM_VERSION=$(grep -m1 -i '^# Version:' raw_ultimate.txt | sed 's/^# Version:[[:space:]]*//I' | tr -d '\r' || true)

          echo "Writing final file with header..."
          {
            echo "# Title: HaGeZi's Ultimate DNS Blocklist (Surge DOMAIN-SET)"
            echo "# Source: $URL"
            echo "# Upstream version: ${UPSTREAM_VERSION:-unknown}"
            echo "# Last modified: $(date -u +'%d %b %Y %H:%M UTC')"
            echo "# Syntax: Surge DOMAIN-SET"
            echo "# Number of entries: $COUNT"
            echo "#"
            cat body.tmp
          } > hagezi_ultimate.list

          rm raw_ultimate.txt body.tmp

      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -n "$(git status --porcelain)" ]; then
            git add hagezi_ultimate.list
            git commit -m "Auto-update HaGeZi Ultimate: $(date -u +'%Y-%m-%d')"
            git pull --rebase
            git push
            echo "✅ Rules updated and pushed!"
          else
            echo "🤷‍♂️ No changes, nothing to push."
          fi
